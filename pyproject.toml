[project]
name = "chatup"
version = "0.1.0"
description = "ChatUp backend (course build)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
chatup-api = "chatup.api.main:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
