[project]
name = "chatup"
version = "0.1.0"
description = "ChatUp backend (course build)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115.0",
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-store-postgres>=0.1.0",
    "langmem>=0.0.30",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
chatup-api = "chatup.api.main:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
